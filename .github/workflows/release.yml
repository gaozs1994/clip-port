name: Build Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify COS publishing credentials
        shell: pwsh
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if (-not $env:COS_SECRET_ID -or -not $env:COS_SECRET_KEY) {
            throw "Configure COS_SECRET_ID and COS_SECRET_KEY in repository Actions secrets."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Voicebox runtime
        uses: actions/cache@v4
        with:
          path: vendor/voicebox
          key: voicebox-win32-x64-v0.5.0-${{ hashFiles('scripts/prepare-voicebox.cjs') }}

      - name: Set release version
        run: npm version --no-git-tag-version "0.1.${{ github.run_number }}"

      - name: Build Windows installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLIPPORT_RELEASE_BUILD: "1"
        run: npm run dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter "ClipPort.Setup.*.exe" |
            Where-Object { $_.Name -notlike "*uninstaller*" } |
            Select-Object -First 1
          $blockmap = Get-ChildItem -Path dist -Filter "ClipPort.Setup.*.exe.blockmap" |
            Select-Object -First 1
          $updateManifest = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          $releaseHistory = Get-Item -Path "output/release-notes.json" -ErrorAction SilentlyContinue
          $releaseNotes = Get-Item -Path "output/release-notes.md" -ErrorAction SilentlyContinue

          if (-not $installer -or -not $blockmap -or -not $updateManifest -or -not $releaseHistory -or -not $releaseNotes) {
            throw "Installer, update manifest, or release notes were not produced."
          }

          gh release create $env:RELEASE_TAG $installer.FullName $blockmap.FullName $updateManifest.FullName $releaseHistory.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ClipPort $env:RELEASE_TAG" `
            --notes-file $releaseNotes.FullName `
            --latest

      - name: Publish and verify COS update files
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: npm run publish:cos
