name: Build Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        run: npm version --no-git-tag-version "0.1.${{ github.run_number }}"

      - name: Build Windows installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter "ClipPort.Setup.*.exe" |
            Where-Object { $_.Name -notlike "*uninstaller*" } |
            Select-Object -First 1
          $blockmap = Get-ChildItem -Path dist -Filter "ClipPort.Setup.*.exe.blockmap" |
            Select-Object -First 1
          $updateManifest = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue

          if (-not $installer -or -not $blockmap -or -not $updateManifest) {
            throw "Installer, blockmap, or update manifest was not produced."
          }

          gh release create $env:RELEASE_TAG $installer.FullName $blockmap.FullName $updateManifest.FullName `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ClipPort $env:RELEASE_TAG" `
            --generate-notes `
            --latest
